name: spendable
description: Spendable for iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  app_links: ^7.2.1
  built_collection: ^5.1.1
  decimal: ^3.2.6
  device_info_plus: ^13.2.0
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  flutter_slidable: ^4.0.3
  flutter_svg: ^2.3.0
  google_sign_in: ^7.2.0
  plaid_flutter: ^5.2.1
  riverpod_annotation: ^4.0.6
  sign_in_with_apple: ^8.1.0

  # Generated from priv/static/openapi.json - see tool/generate_api.sh.
  spendable_api:
    path: api

dev_dependencies:
  build_runner: ^2.16.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.8

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
